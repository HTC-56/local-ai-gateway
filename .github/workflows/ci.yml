name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No model, no GPU: the integration tests run an in-process mock upstream.
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/scrub-check.sh
      - run: bash scripts/readme-lint.sh
